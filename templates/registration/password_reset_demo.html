{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<div class="container">

    <div class="card" style="max-width: 500px; margin: auto; margin-top: 80px;">

        <h1>🔐 Recuperar contraseña</h1>

        <p>
            Ingresa tu correo electrónico para generar el enlace de recuperación.
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Generar enlace
            </button>

        </form>

        {% if reset_url %}

            <hr>

            <h3>Enlace generado</h3>

            <p>
                Haz click aquí para continuar:
            </p>

            <a class="btn" href="{{ reset_url }}">
                Continuar recuperación
            </a>

        {% endif %}

    </div>

</div>

</body>
</html>
