{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Reserva</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<div class="container">

    <div class="card" style="max-width: 500px; margin: auto; margin-top: 60px;">

        <h1>Crear Reserva</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Crear Reserva</button>
        </form>

        <br>

        <a class="btn" href="{% url 'lista_reservas' %}">
            Volver
        </a>

    </div>

</div>

</body>
</html>
